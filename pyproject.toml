[project]
name = "geospatial-python"
version = "1.0.0"
description = "JGI training course: Geospatial Python"
readme = "README.md"
requires-python = ">=3.12"
# Packages to render the course, run tests/check_notes.py and redraw the
# diagrams (assets/make_diagrams.py). Attendees use Google Colab instead.
dependencies = [
    "contextily",
    "folium",
    "geopandas>=1.0",
    "jupyter",
    "mapclassify",
    "matplotlib",
    "scipy",
]

[dependency-groups]
# Quarto, for rendering locally. The GitHub Action installs its own.
dev = ["quarto-cli"]
